<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Блокнот</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #d4d0c8;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Рядок меню */
    .menu-bar {
      background: #ece9d8;
      border-bottom: 1px solid #aca899;
      display: flex;
      font-size: 14px;
      user-select: none;
      flex: 0 0 auto;
    }

    .menu-bar > .menu-item {
      position: relative;
      padding: 6px 12px;
      cursor: pointer;
      color: #1e1e1e;
    }

    .menu-bar > .menu-item:hover {
      background: #005499;
      color: #fff;
    }

    .menu-item .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      border: 1px solid #aca899;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      min-width: 170px;
      z-index: 10;
    }

    .menu-item.open .dropdown { display: block; }

    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 14px;
      background: transparent;
      border: none;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      color: #1e1e1e;
    }

    .dropdown button:hover {
      background: #005499;
      color: #fff;
    }

    /* Область редагування */
    .area { flex: 1 1 auto; min-height: 0; display: flex; background: #d4d0c8; padding: 4px; }

    #editor {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      resize: none;
      padding: 8px 10px;
      font-family: 'Lucida Console', Consolas, 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.45;
      color: #000;
      background: #fff;
      border: 1px solid #7f9db9;
      outline: none;
      white-space: pre;
      overflow: auto;
    }

    #editor:focus { border-color: #005499; }

    /* Статус-бар */
    .status-bar {
      flex: 0 0 auto;
      background: #ece9d8;
      border-top: 1px solid #aca899;
      padding: 4px 14px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #1e1e1e;
    }

    .status-bar .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="menu-bar">
    <div class="menu-item" data-menu>
      Файл
      <div class="dropdown">
        <button id="newBtn">Новий</button>
        <button id="openBtn">Відкрити…</button>
        <button id="saveBtn">Зберегти</button>
        <button id="saveAsBtn">Зберегти як…</button>
      </div>
    </div>
    <div class="menu-item" data-menu>
      Правка
      <div class="dropdown">
        <button id="undoBtn">Скасувати</button>
        <button id="cutBtn">Вирізати</button>
        <button id="copyBtn">Копіювати</button>
        <button id="pasteBtn">Вставити</button>
        <button id="selectAllBtn">Виділити все</button>
      </div>
    </div>
    <div class="menu-item" data-menu>
      Довідка
      <div class="dropdown">
        <button id="aboutBtn">Про Блокнот</button>
      </div>
    </div>
  </div>

  <div class="area">
    <textarea id="editor" spellcheck="false" wrap="off"></textarea>
  </div>

  <div class="status-bar">
    <span class="file" id="fileName">document.txt</span>
    <span id="cursorInfo">Рядок 1, стовпець 1</span>
  </div>

  <script>
    (function () {
      const editor = document.getElementById('editor');
      const fileNameEl = document.getElementById('fileName');
      const cursorInfo = document.getElementById('cursorInfo');

      const TXT_TYPES = [{ description: 'Текстові файли', accept: { 'text/plain': ['.txt'] } }];
      const DOC_TYPES = [{ description: 'Документи WordPad', accept: { 'application/msword': ['.doc'] } }];
      const PICK_TYPES = TXT_TYPES.concat(DOC_TYPES);

      let fileHandle = null;

      const isDoc = name => /\.doc$/i.test(name || '');

      function decode(bytes) {
        try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
        catch (_) { return new TextDecoder('utf-8').decode(bytes); }
      }

      function looksBinary(bytes) {
        const n = Math.min(bytes.length, 8000);
        for (let i = 0; i < n; i++) if (bytes[i] === 0) return true;
        return false;
      }

      function updateCursor() {
        const pos = editor.selectionStart;
        const upto = editor.value.slice(0, pos);
        const line = upto.split('\n').length;
        const col = pos - upto.lastIndexOf('\n');
        cursorInfo.textContent = `Рядок ${line}, стовпець ${col}`;
      }

      async function loadHandle(handle) {
        const file = await handle.getFile();
        const bytes = new Uint8Array(await file.arrayBuffer());
        if (looksBinary(bytes) && !isDoc(file.name)) {
          editor.value = '';
          fileNameEl.textContent = file.name;
          alert('«' + file.name + '» — двійковий файл, його не можна показати як текст.');
          return;
        }
        let text = decode(bytes);
        if (isDoc(file.name)) {
          const div = document.createElement('div');
          div.innerHTML = text;          // .doc (WordPad) — прибираємо форматування
          text = div.innerText;
        }
        editor.value = text;
        fileHandle = handle;
        fileNameEl.textContent = file.name;
        updateCursor();
        editor.focus();
      }

      async function writeTo(handle) {
        const writable = await handle.createWritable();
        await writable.write(editor.value);
        await writable.close();
      }

      // --- Рядок меню ---
      document.querySelectorAll('[data-menu]').forEach(item => {
        item.addEventListener('click', e => {
          e.stopPropagation();
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('[data-menu]').forEach(m => m.classList.remove('open'));
          if (!isOpen) item.classList.add('open');
        });
      });
      document.addEventListener('click', () => {
        document.querySelectorAll('[data-menu]').forEach(m => m.classList.remove('open'));
      });

      // --- Пункти меню ---
      document.getElementById('newBtn').onclick = () => {
        editor.value = '';
        fileHandle = null;
        fileNameEl.textContent = 'document.txt';
        updateCursor();
        editor.focus();
      };

      document.getElementById('openBtn').onclick = async () => {
        try {
          const [handle] = await showOpenFilePicker({ types: PICK_TYPES, multiple: false });
          await loadHandle(handle);
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      };

      document.getElementById('saveBtn').onclick = async () => {
        try {
          if (!fileHandle) {
            fileHandle = await showSaveFilePicker({ suggestedName: 'document.txt', types: TXT_TYPES });
          }
          await writeTo(fileHandle);
          fileNameEl.textContent = fileHandle.name;
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      };

      document.getElementById('saveAsBtn').onclick = async () => {
        try {
          const handle = await showSaveFilePicker({
            suggestedName: (fileHandle && fileHandle.name) || 'document.txt',
            types: TXT_TYPES
          });
          await writeTo(handle);
          fileHandle = handle;
          fileNameEl.textContent = handle.name;
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      };

      document.getElementById('undoBtn').onclick = () => { editor.focus(); document.execCommand('undo'); };
      document.getElementById('cutBtn').onclick = () => { editor.focus(); document.execCommand('cut'); };
      document.getElementById('copyBtn').onclick = () => { editor.focus(); document.execCommand('copy'); };
      document.getElementById('pasteBtn').onclick = async () => {
        editor.focus();
        try {
          const txt = await navigator.clipboard.readText();
          const s = editor.selectionStart, e = editor.selectionEnd;
          editor.setRangeText(txt, s, e, 'end');
        } catch (_) { document.execCommand('paste'); }
      };
      document.getElementById('selectAllBtn').onclick = () => { editor.focus(); editor.select(); };
      document.getElementById('aboutBtn').onclick = () =>
        alert('Блокнот — простий текстовий редактор.\nПрацює з файлами .txt; файли .doc відкриває без форматування.');

      // --- Виклик з робочого столу/провідника ---
      window.vfsOpenFile = async function (path, id) {
        if (!window.VFS || !window.VFS.__loaded) return;
        try {
          let handle = null;
          if (path) handle = await VFS.getFileHandle(path);
          else if (id != null) handle = await VFS.getFileHandle(await VFS.pathOf(id));
          if (handle) await loadHandle(handle);
        } catch (err) {
          console.error('Блокнот: не вдалося відкрити файл:', err);
        }
      };

      // --- Події ---
      editor.addEventListener('keyup', updateCursor);
      editor.addEventListener('click', updateCursor);
      editor.addEventListener('input', updateCursor);
      editor.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key.toLowerCase() === 's') {
          e.preventDefault();
          if (e.shiftKey) document.getElementById('saveAsBtn').click();
          else document.getElementById('saveBtn').click();
        }
      });

      updateCursor();
      editor.focus();
    })();
  </script>
</body>
</html>
